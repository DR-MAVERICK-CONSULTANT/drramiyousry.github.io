<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title id="page-title">Inquiries Dashboard — Dr. Ramy Yousry</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<style>
  body.admin-body{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .admin-wrap{ width:100%; max-width:1100px; margin:0 auto; }
  .lock-box{ max-width:380px; margin:120px auto; background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:32px; text-align:center; }
  .lock-box h2{ color:var(--text-primary); margin-bottom:6px; font-family:var(--font-tech); }
  .lock-box p{ color:var(--text-muted); font-size:0.85rem; margin-bottom:18px; }
  .lock-box input{ width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:rgba(255,255,255,0.03); color:var(--text-primary); font-family:var(--font-main); margin-bottom:14px; }
  .lock-box button{ width:100%; padding:12px; border-radius:10px; border:none; background:var(--gradient-primary); color:#04101f; font-weight:700; cursor:pointer; font-family:var(--font-main); }
  .lock-error{ color:#ff9966; font-size:0.8rem; margin-top:10px; display:none; }

  .dash-header{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:24px; }
  .dash-title{ display:flex; align-items:center; gap:12px; }
  .dash-title h1{ font-family:var(--font-tech); color:var(--text-primary); font-size:1.4rem; }
  .badge-count{ background:var(--accent); color:#fff; border-radius:999px; padding:4px 12px; font-size:0.8rem; font-weight:700; }
  .badge-count.zero{ background:rgba(255,255,255,0.08); color:var(--text-muted); }
  .dash-actions{ display:flex; gap:10px; }
  .dash-btn{ background:var(--bg-glass); border:1px solid var(--border); color:var(--text-primary); padding:9px 16px; border-radius:10px; cursor:pointer; font-family:var(--font-main); font-size:0.85rem; }
  .dash-btn:hover{ border-color:var(--border-hover); }

  .cards-list{ display:flex; flex-direction:column; gap:14px; }
  .lead-card{ background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:18px 20px; position:relative; transition:var(--transition); }
  .lead-card.unread{ border-color:var(--border-glow); box-shadow:0 0 0 1px var(--primary-glow); }
  .lead-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .lead-name{ color:var(--text-primary); font-weight:700; font-size:1.05rem; }
  .lead-name .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--success); margin-right:8px; vertical-align:middle; }
  .lead-date{ color:var(--text-muted); font-size:0.78rem; white-space:nowrap; }
  .lead-meta{ display:flex; gap:16px; flex-wrap:wrap; margin:8px 0; font-size:0.85rem; color:var(--text-secondary); }
  .lead-meta a{ color:var(--primary); text-decoration:none; }
  .lead-tag{ display:inline-block; background:var(--bg-glass); border:1px solid var(--border); border-radius:6px; padding:2px 10px; font-size:0.75rem; color:var(--text-secondary); }
  .lead-msg{ color:var(--text-secondary); font-size:0.9rem; line-height:1.5; margin-top:6px; white-space:pre-wrap; }
  .lead-mark{ margin-top:12px; font-size:0.78rem; color:var(--primary); cursor:pointer; background:none; border:none; padding:0; }
  .empty-state{ text-align:center; color:var(--text-muted); padding:80px 20px; }
  .loading-state{ text-align:center; color:var(--text-muted); padding:60px 20px; }
</style>
</head>
<body class="ltr-mode admin-body">

<div id="lock-screen">
  <div class="lock-box">
    <h2>🔒 Restricted Area</h2>
    <p>Enter your dashboard password to view inquiries.</p>
    <input type="password" id="admin-pass" placeholder="Password" autocomplete="off"/>
    <button id="unlock-btn">Unlock</button>
    <div class="lock-error" id="lock-error">Incorrect password.</div>
  </div>
</div>

<div class="admin-wrap" id="dashboard" style="display:none;">
  <div class="dash-header">
    <div class="dash-title">
      <h1>📬 Inquiries Dashboard</h1>
      <span class="badge-count zero" id="unread-badge">0 new</span>
    </div>
    <div class="dash-actions">
      <button class="dash-btn" id="refresh-btn">↻ Refresh</button>
      <a class="dash-btn" href="index.html">← Back to site</a>
    </div>
  </div>
  <div id="list-container">
    <div class="loading-state">Loading…</div>
  </div>
</div>

<script>
  /* =====================================================================
     CONFIG — must match Code.gs values exactly.
     See SETUP-GUIDE-AR.md for how to fill these in.
     ===================================================================== */
  const WEBAPP_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';
  const SECRET_KEY = 'DRRAMY';

  // This is a simple client-side gate to keep casual visitors out.
  // It is NOT strong security — anyone who reads the page source can see it.
  // Do not use this page for highly sensitive data.
  const DASHBOARD_PASSWORD = 'DRRAMY';

  const lockScreen = document.getElementById('lock-screen');
  const dashboard = document.getElementById('dashboard');
  const passInput = document.getElementById('admin-pass');
  const unlockBtn = document.getElementById('unlock-btn');
  const lockError = document.getElementById('lock-error');

  function unlock() {
    if (passInput.value === DASHBOARD_PASSWORD) {
      sessionStorage.setItem('admin_unlocked', '1');
      lockScreen.style.display = 'none';
      dashboard.style.display = 'block';
      loadData();
    } else {
      lockError.style.display = 'block';
    }
  }
  unlockBtn.addEventListener('click', unlock);
  passInput.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

  if (sessionStorage.getItem('admin_unlocked') === '1') {
    lockScreen.style.display = 'none';
    dashboard.style.display = 'block';
    loadData();
  }

  document.getElementById('refresh-btn')?.addEventListener('click', loadData);

  async function loadData() {
    const container = document.getElementById('list-container');
    container.innerHTML = '<div class="loading-state">Loading…</div>';

    if (!WEBAPP_URL || WEBAPP_URL.includes('PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE')) {
      container.innerHTML = '<div class="empty-state">⚙️ Please configure WEBAPP_URL in admin.html first (see SETUP-GUIDE-AR.md).</div>';
      return;
    }

    try {
      const resp = await fetch(`${WEBAPP_URL}?key=${encodeURIComponent(SECRET_KEY)}`);
      const data = await resp.json();

      if (data.result !== 'success') {
        container.innerHTML = `<div class="empty-state">❌ ${data.error || 'Unable to load data.'}</div>`;
        return;
      }

      const rows = (data.rows || []).slice().reverse(); // newest first
      const unreadCount = rows.filter(r => r.Status !== 'read').length;

      const badge = document.getElementById('unread-badge');
      badge.textContent = `${unreadCount} new`;
      badge.classList.toggle('zero', unreadCount === 0);

      if (rows.length === 0) {
        container.innerHTML = '<div class="empty-state">No inquiries yet. New submissions will appear here.</div>';
        return;
      }

      container.innerHTML = '<div class="cards-list"></div>';
      const list = container.querySelector('.cards-list');

      rows.forEach(r => {
        const isUnread = r.Status !== 'read';
        const card = document.createElement('div');
        card.className = 'lead-card' + (isUnread ? ' unread' : '');
        const dateStr = r.Timestamp ? new Date(r.Timestamp).toLocaleString() : '';
        card.innerHTML = `
          <div class="lead-top">
            <div class="lead-name">${isUnread ? '<span class="dot"></span>' : ''}${escapeHtml(r.Name || 'Unknown')}</div>
            <div class="lead-date">${dateStr}</div>
          </div>
          <div class="lead-meta">
            ${r.Email ? `<a href="mailto:${escapeAttr(r.Email)}">📧 ${escapeHtml(r.Email)}</a>` : ''}
            ${r.Phone ? `<a href="tel:${escapeAttr(r.Phone)}">📱 ${escapeHtml(r.Phone)}</a>` : ''}
            ${r.Interest ? `<span class="lead-tag">${escapeHtml(r.Interest)}</span>` : ''}
          </div>
          ${r.Message ? `<div class="lead-msg">${escapeHtml(r.Message)}</div>` : ''}
          ${isUnread ? `<button class="lead-mark" data-row="${r._row}">✓ Mark as read</button>` : ''}
        `;
        list.appendChild(card);
      });

      list.querySelectorAll('.lead-mark').forEach(btn => {
        btn.addEventListener('click', async () => {
          const row = btn.getAttribute('data-row');
          btn.textContent = '…';
          try {
            await fetch(`${WEBAPP_URL}?key=${encodeURIComponent(SECRET_KEY)}&action=markRead&row=${row}`);
            loadData();
          } catch { btn.textContent = '✓ Mark as read'; }
        });
      });

    } catch (err) {
      container.innerHTML = '<div class="empty-state">❌ Network error. Please try again.</div>';
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(str) { return escapeHtml(str); }
</script>
</body>
</html>
